    </a>

    <!-- Desktop Nav Links -->
    <nav class="hidden md:flex items-center gap-1">
      <a hlmBtn variant="link" routerLink="/snippets" class="text-foreground hover:text-primary">
        Public Snippets
      </a>
      <a hlmBtn variant="link" routerLink="/groups" class="text-foreground hover:text-primary">
        Public Groups
      </a>
      @if (isAuthenticated()) {
        <a hlmBtn variant="link" href="#" class="text-foreground hover:text-foreground">
          My Snippets
        </a>
      }
    </nav>
  </div>

  <!-- Desktop Right Section -->
  <div class="hidden md:flex items-center gap-3">
    @if (!isAuthenticated()) {
      <button hlmBtn variant="outline" size="sm" (click)="toggleAuthDemo()">
        Sign In
      </button>
      <button hlmBtn variant="default" size="sm" class="bg-primary text-primary-foreground font-semibold hover:opacity-90">
        Get Started
      </button>
    } @else {
      <button hlmBtn variant="ghost" size="sm" class="gap-2 px-2" (click)="toggleAuthDemo()">
        <div class="h-7 w-7 rounded-full bg-primary text-primary-foreground font-bold text-xs flex items-center justify-center uppercase">
          V
        </div>
        <span class="text-sm font-medium">vmarushka</span>
        <ng-icon name="lucideChevronDown" class="text-xs text-muted-foreground" />
      </button>
    }

    <button hlmBtn variant="outline" size="icon" class="h-9 w-9 rounded-md" (click)="toggleTheme()" aria-label="Toggle Theme">
      <ng-icon [name]="isDarkMode() ? 'lucideSun' : 'lucideMoon'" class="text-base" />
    </button>
  </div>

  <!-- Mobile Burger Menu (Spartan Sheet) -->
  <div class="flex md:hidden items-center">
    <hlm-sheet side="right">
      <button hlmBtn variant="ghost" size="icon" hlmSheetTrigger aria-label="Open Menu">
        <ng-icon name="lucideMenu" class="text-xl" />
      </button>

      <hlm-sheet-content *hlmSheetPortal="let ctx" class="bg-background text-foreground border-l border-border pt-2 px-4 shadow-lg">
        <hlm-sheet-header>
          <h2 hlmSheetTitle class="text-lg">Navigation Menu</h2>
        </hlm-sheet-header>

        <div class="flex flex-col gap-3 px-2">
          <!-- Public Links -->
          <a hlmBtn variant="ghost" class="justify-start text-base text-md" routerLink="/snippets">
            <ng-icon name="lucideCode" class="mr-2 text-muted-foreground" />
            Public Snippets
          </a>

          <a hlmBtn variant="ghost" class="justify-start text-base text-md" routerLink="/groups">
            <ng-icon name="lucideFolder" class="mr-2 text-muted-foreground" />
            Public Groups
          </a>

          @if (isAuthenticated()) {
            <!-- Auth specific options -->
            <a hlmBtn variant="ghost" class="justify-start text-base text-md" href="#">
              <ng-icon name="lucideFolder" class="mr-2 text-muted-foreground" />
              My Snippets
            </a>
            <button hlmBtn variant="ghost" class="justify-start text-base text-md" (click)="toggleAuthDemo()">
              <div class="h-6 w-6 rounded-full bg-primary text-primary-foreground font-bold text-xs flex items-center justify-center mr-2 uppercase">
                V
              </div>
              Profile (vmarushka)
            </button>
          } @else {
            <!-- Guest options -->
            <button hlmBtn variant="outline" class="mt-2 w-full justify-start text-sm" (click)="toggleAuthDemo()">
              <ng-icon name="lucideLogIn" class="mr-2" />
              Sign In
            </button>
            <button hlmBtn variant="default" class="w-full justify-start text-sm">
              <ng-icon name="lucideUserPlus" class="mr-2" />
              Get Started
            </button>
          }

          <div class="my-1.5 border-t border-border/60"></div>

          <!-- Theme option inside burger -->
          <button hlmBtn variant="ghost" class="justify-start text-base text-md" (click)="toggleTheme()">
            <ng-icon [name]="isDarkMode() ? 'lucideSun' : 'lucideMoon'" class="mr-2 text-base" />
            Theme: {{ isDarkMode() ? 'Dark' : 'Light' }}
          </button>
        </div>
      </hlm-sheet-content>
    </hlm-sheet>
  </div>
</header>
